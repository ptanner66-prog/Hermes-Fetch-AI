name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: build and release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag matches pyproject version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match pyproject version {expected!r}")
          PY

      - name: Install package with dev extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Verify before release
        run: |
          python -m hermes_fetch_ai.cli doctor
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src tests
          python -m pytest -q --cov --cov-fail-under=90
          python -m hermes_fetch_ai.cli demo local
          python -m hermes_fetch_ai.cli demo paid
          python -m hermes_fetch_ai.cli demo chat
          python -m hermes_fetch_ai.cli demo buy

      - name: Dependency audit
        run: |
          # Upstream exceptions, documented in docs/security.md:
          # - CVE-2025-69277: uagents -> cosmpy pins PyNaCl==1.6.0; remove once PyNaCl>=1.6.2 is allowed.
          # - PYSEC-2026-1325: ecdsa (via uagents-core/cosmpy) Minerva timing side channel; no fix exists.
          python -m pip_audit --skip-editable --ignore-vuln CVE-2025-69277 --ignore-vuln PYSEC-2026-1325

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install built wheel in clean environment
        shell: bash
        run: |
          python -m venv /tmp/hfa-release-smoke
          source /tmp/hfa-release-smoke/bin/activate
          python -m pip install -U pip
          python -m pip install dist/*.whl
          hermes-fetch-ai --version
          hermes-fetch-ai doctor
          hermes-fetch-ai demo local
          hermes-fetch-ai demo paid
          hermes-fetch-ai demo chat
          hermes-fetch-ai demo buy

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      # Opt-in: set the repository variable PUBLISH_TO_PYPI=true after configuring a
      # PyPI trusted publisher for this repo, workflow release.yml, environment release.
      - name: Publish to PyPI (trusted publishing)
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
