name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-scan:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  build-and-release:
    name: build and release
    needs: [verify, security-scan]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate tag matches pyproject version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match pyproject version {expected!r}")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Install package with dev extras
        run: |
          uv sync --locked --extra dev --python 3.12

      - name: Verify before release
        run: |
          uv run --locked --extra dev python -m hermes_fetch_ai.cli doctor
          uv run --locked --extra dev python -m ruff check .
          uv run --locked --extra dev python -m ruff format --check .
          uv run --locked --extra dev python -m mypy src tests
          uv run --locked --extra dev python -m pytest -q --cov --cov-fail-under=90
          uv run --locked --extra dev python -m hermes_fetch_ai.cli demo local
          uv run --locked --extra dev python -m hermes_fetch_ai.cli demo paid
          uv run --locked --extra dev python -m hermes_fetch_ai.cli demo chat
          uv run --locked --extra dev python -m hermes_fetch_ai.cli demo buy

      - name: Dependency audit
        run: |
          # Upstream exceptions, documented in docs/security.md:
          # - CVE-2025-69277: uagents -> cosmpy pins PyNaCl==1.6.0; remove once PyNaCl>=1.6.2 is allowed.
          # - PYSEC-2026-1325: ecdsa (via uagents-core/cosmpy) Minerva timing side channel; no fix exists.
          uv run --locked --extra dev python -m pip_audit --skip-editable --ignore-vuln CVE-2025-69277 --ignore-vuln PYSEC-2026-1325

      - name: Build sdist and wheel
        run: uv run --locked --extra dev python -m build

      - name: Validate package metadata
        run: uv run --locked --extra dev python -m twine check dist/*

      - name: Install built wheel outside the source checkout
        run: uv run --locked --extra dev python tests/wheel_smoke.py dist/*.whl

      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: "dist/*"

      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*
          generate_release_notes: true

      # Opt-in: set the repository variable PUBLISH_TO_PYPI=true after configuring a
      # PyPI trusted publisher for this repo, workflow release.yml, environment release.
      - name: Publish to PyPI (trusted publishing)
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
