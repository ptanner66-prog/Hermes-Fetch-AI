name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@793b778da9c9275a0f276522b27cb5fc14bba279 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
