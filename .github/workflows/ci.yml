name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Install package with dev extras
        run: |
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Doctor (config + version pins)
        run: uv run --locked --extra dev python -m hermes_fetch_ai.cli doctor

      - name: Lint (ruff)
        run: uv run --locked --extra dev python -m ruff check .

      - name: Format check (ruff)
        run: uv run --locked --extra dev python -m ruff format --check .

      - name: Type check (mypy)
        run: uv run --locked --extra dev python -m mypy src tests

      - name: Unit and production smoke tests (pytest)
        run: uv run --locked --extra dev python -m pytest -q

      - name: Local end-to-end demo (in-process uAgent round trip)
        run: uv run --locked --extra dev python -m hermes_fetch_ai.cli demo local

      - name: Paid service demo (offline, simulated testnet ledger)
        run: uv run --locked --extra dev python -m hermes_fetch_ai.cli demo paid

      - name: Chat sale demo (offline, the way an ASI:One user buys)
        run: uv run --locked --extra dev python -m hermes_fetch_ai.cli demo chat

      - name: Buying demo (offline, the way Hermes buys from another agent)
        run: uv run --locked --extra dev python -m hermes_fetch_ai.cli demo buy

  package:
    name: package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Build and inspect artifacts
        run: |
          uv sync --locked --extra dev --python 3.12
          uv run --locked --extra dev python -m build
          uv run --locked --extra dev python -m twine check dist/*

      - name: Install built wheel outside the source checkout
        run: uv run --locked --extra dev python tests/wheel_smoke.py dist/*.whl

  coverage:
    name: test coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Install package with dev extras
        run: |
          uv sync --locked --extra dev --python 3.12

      - name: Tests with branch coverage, including CLI and serve subprocesses
        run: uv run --locked --extra dev python -m pytest -q --cov --cov-fail-under=90

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Audit dependencies
        run: |
          uv sync --locked --extra dev --python 3.12
          # Upstream exceptions, documented in docs/security.md:
          # - CVE-2025-69277: uagents -> cosmpy pins PyNaCl==1.6.0; remove once PyNaCl>=1.6.2 is allowed.
          # - PYSEC-2026-1325: ecdsa (via uagents-core/cosmpy) Minerva timing side channel; no fix exists.
          uv run --locked --extra dev python -m pip_audit --skip-editable --ignore-vuln CVE-2025-69277 --ignore-vuln PYSEC-2026-1325

  hermes-plugin:
    name: hermes plugin + field test (Hermes ${{ matrix.hermes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # hermes-agent commits the plugin and the stdio field test run against.
        # Bump deliberately, then update requires_hermes in the plugin manifest
        # and the "last run" note in docs/demo.md.
        include:
          # Supported release (tag v2026.9.24): the plugin's requires_hermes floor.
          - hermes: "0.21.5"
            ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
            python: "3.11"
          # main moved to Python 3.14 after 0.21.5.
          - hermes: "main"
            ref: bb2362878b33e14e8b7d24d621510e087269fdce
            python: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout hermes-agent at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }} (Hermes)
        id: hermes-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Python 3.12 (bridge)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Hermes from its checkout
        run: |
          "${{ steps.hermes-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/hermes-venv"
          "$RUNNER_TEMP/hermes-venv/bin/python" -m pip install -U pip
          "$RUNNER_TEMP/hermes-venv/bin/python" -m pip install -e "hermes-agent[mcp]"
          "$RUNNER_TEMP/hermes-venv/bin/hermes" --version

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Install the bridge
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Catalog admission checks (hermes plugins validate + doctor)
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home-validate"
          "$RUNNER_TEMP/hermes-venv/bin/hermes" plugins validate hermes-plugin/fetchai-bridge --install-deps
          "$RUNNER_TEMP/hermes-venv/bin/hermes" plugins doctor hermes-plugin/fetchai-bridge --ci

      - name: Plugin CLI smoke (hermes fetchai-bridge)
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home-plugin"
          mkdir -p "$HERMES_HOME/plugins"
          cp -r hermes-plugin/fetchai-bridge "$HERMES_HOME/plugins/"
          hermes="$RUNNER_TEMP/hermes-venv/bin/hermes"
          "$hermes" plugins enable fetchai-bridge
          "$hermes" fetchai-bridge doctor
          "$hermes" fetchai-bridge demo local | tee demo.out
          grep -q "echo result: hello" demo.out

      - name: Field test against real Hermes tools (stdio)
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home-field"
          mkdir -p "$HERMES_HOME/skills/note-taking"
          cp -r hermes-agent/skills/note-taking/obsidian "$HERMES_HOME/skills/note-taking/"
          HERMES_FETCH_FIELD_TEST=1 HERMES_FETCH_HERMES_PYTHON="$RUNNER_TEMP/hermes-venv/bin/python" \
            uv run --locked --extra dev python -m pytest tests/test_field_hermes_stdio.py -q -rs

      - name: Field test of the guest Hermes runner (paid services)
        run: |
          # Each run gets its own throwaway Hermes home; nothing here is shared.
          unset HERMES_HOME
          HERMES_FETCH_FIELD_TEST=1 HERMES_FETCH_HERMES_PYTHON="$RUNNER_TEMP/hermes-venv/bin/python" \
            uv run --locked --extra dev python -m pytest tests/test_field_guest_hermes.py -q -rs

      - name: Field test of the buying guards (YOLO check and payment prompt)
        run: |
          unset HERMES_HOME
          HERMES_FETCH_FIELD_TEST=1 HERMES_FETCH_HERMES_PYTHON="$RUNNER_TEMP/hermes-venv/bin/python" \
            uv run --locked --extra dev python -m pytest tests/test_field_hermes_buyer.py -q -rs
