[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fetch-ai"
version = "1.0.0"
description = "Thin policy-aware bridge between Hermes Agent tools and Fetch.ai uAgents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "Porter Tanner"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]

dependencies = [
  "uagents==0.25.5",
  "uagents-core==0.4.9",
  "uagents-adapter[mcp]==0.6.2",
  "mcp==1.28.1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.urls]
Homepage = "https://github.com/ptanner66-prog/Hermes-Fetch-AI"
Repository = "https://github.com/ptanner66-prog/Hermes-Fetch-AI"
Documentation = "https://github.com/ptanner66-prog/Hermes-Fetch-AI#readme"
Issues = "https://github.com/ptanner66-prog/Hermes-Fetch-AI/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "anyio>=4,<5",
  "ruff>=0.16,<0.17",
  "mypy>=2.4,<2.5",
  "types-PyYAML",
  "types-jsonschema",
  "build>=1.2,<2",
  "twine>=6,<7",
  "pip-audit>=2.9,<3",
]

[project.scripts]
hermes-fetch-ai = "hermes_fetch_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_fetch_ai = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: the test may connect outside this machine (opt-in live tests only)"]

[tool.coverage.run]
source = ["hermes_fetch_ai"]
branch = true
# The CLI and `serve` tests run the package in subprocesses; measure those too.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Hermes loads directory plugins by path and names them like `fetchai-bridge`.
"hermes-plugin/*/__init__.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# uAgents ships without type information (no py.typed marker).
module = ["uagents", "uagents.*", "uagents_core.*", "uagents_adapter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules subclass uAgents classes and use its decorators, which are untyped.
module = [
  "hermes_fetch_ai.direct_protocol",
  "hermes_fetch_ai.registration_policies",
  "hermes_fetch_ai.uagent_app",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Strict typing covers the package; tests keep the default (unannotated test
# functions are not type-checked).
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
