version: 1
agent:
  name: hermes_fetch_hermes_local
  port: 8002
  network: testnet
  mode: endpoint
  publish_manifest: false
  enable_agent_inspector: false
  dev_random_seed: true
hermes_mcp:
  mode: in_process_hermes_tools
policy:
  public_tools:
    - skills_list
  denied_tools:
    - skill_view
    - web_search
    - web_extract
    - browser_navigate
    - browser_click
    - browser_type
    - browser_press
    - browser_snapshot
    - browser_scroll
    - browser_back
    - browser_get_images
    - browser_console
    - browser_vision
    - vision_analyze
    - image_generate
    - text_to_speech
    - kanban_complete
    - kanban_block
    - kanban_schedule
    - kanban_request_review
    - kanban_request_changes
    - kanban_comment
    - kanban_heartbeat
    - kanban_show
    - kanban_list
    - kanban_create
    - kanban_unblock
    - kanban_link
    - terminal
    - patch
    - write_file
chat:
  enable_chat: false
