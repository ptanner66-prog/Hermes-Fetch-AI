# Sell services to other Fetch.ai agents for testnet FET. Guide: docs/payments.md.
#
# Payments use Fetch's Dorado testnet: test FET with no market value.
# Before the first start:
#   1. Set UAGENT_SEED, the agent's identity and wallet key, and back it up.
#   2. Change every /path/to/... below to the real absolute path on your
#      machine (/path/to/bridge/python is the Python `hermes-fetch-ai doctor`
#      names), and /usr/bin/python3 to what `which python3` prints.
#   3. Give the research service's guest Hermes its model key (see below).
#   4. Check the file:
#        hermes-fetch-ai doctor --config examples/paid-services.yaml
#   5. Try a service without payment:
#        hermes-fetch-ai seller try word-count --request "hello there" --config examples/paid-services.yaml
#   6. Start selling:
#        hermes-fetch-ai serve --config examples/paid-services.yaml
version: 1
agent:
  name: hermes_services
  port: 8001
  endpoint: http://127.0.0.1:8001/submit
  mode: endpoint
  publish_manifest: false
  enable_agent_inspector: false
policy:
  public_tools: []  # only the services below; no raw Hermes tools
payments:
  enabled: true
  # payout_address: fetch1...  # where income goes; the default is the agent's own wallet
services:
  research:
    title: Research a topic
    description: >-
      Ask a question and get a short answer with its sources. A Hermes agent
      searches the public web for you; it cannot reach the seller's computer,
      files, or accounts.
    price: "0.05"
    runner:
      # A guest Hermes: a separate Hermes run for each request, in a throwaway
      # home folder, with only the web search tools. Guide: docs/guest-hermes.md.
      type: hermes
      toolsets: [web]
      # Any model your provider offers. Its key goes in the guest's keys file,
      # which `doctor` names (by default
      # ~/.local/state/hermes-fetch-ai/guests/research.env), one line such as
      #   OPENROUTER_API_KEY=...
      # then: chmod 600 that file. Your own Hermes keys are never shared.
      provider: openrouter
      model: anthropic/claude-sonnet-4
      instructions: >-
        Research the client's question with web search, then answer in a few
        short paragraphs, followed by the sources you used (title and URL).
        Say where sources disagree and what you could not find.
      max_turns: 8
      timeout_seconds: 300
      # python: /path/to/hermes-agent/venv/bin/python  # only outside `hermes fetchai-bridge`
    disclaimer: >-
      Researched by an AI agent from public web pages. Check the sources
      before you rely on it.
  security-review:
    title: Defensive code security review
    description: >-
      Send source code and get its security problems explained, with fixes.
      An AI model on the seller's machine reads only the code you send;
      nothing is scanned, contacted, or attacked.
    price: "0.1"
    input:
      max_chars: 20000
      check_urls: false  # URLs inside code are text to review; nothing fetches them
    runner:
      type: command
      # The model server must run on this machine; this is Ollama's default address.
      argv:
        - /path/to/bridge/python  # the Python the bridge runs with: `hermes-fetch-ai doctor` prints it
        - -m
        - hermes_fetch_ai.local_review  # ships with the bridge
        - --url
        - http://127.0.0.1:11434/v1
        - --model
        - qwen2.5-coder:7b
      timeout_seconds: 900
    disclaimer: >-
      Automated review by an AI model. It can miss problems and is not a
      penetration test or a security guarantee.
  word-count:
    title: Word count
    description: Counts the words in your text. A template to replace with your own program.
    price: "0.01"
    runner:
      type: command
      argv: [/usr/bin/python3, /path/to/Hermes-Fetch-AI/examples/services/word_count.py]
