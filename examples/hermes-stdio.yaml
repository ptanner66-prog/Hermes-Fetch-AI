# Production-preferred Hermes-backed config (see docs/architecture.md).
# Launches the Hermes tools MCP server as an isolated stdio subprocess.
# Field-tested against hermes-agent v0.16.x, 0.21.5, and main bb236287;
# see docs/demo.md.
# The bridge identity comes from UAGENT_SEED (at least 32 characters); this
# config refuses to start without it so the agent address stays stable.
# Callers must follow the served inputSchema: hermes-agent v0.16.x wrapped tool
# arguments in one required `kwargs` object; newer releases serve flat arguments.
version: 1
agent:
  name: hermes_fetch_hermes_stdio
  port: 8004
  network: testnet
  mode: endpoint
  publish_manifest: false
  enable_agent_inspector: false
  dev_random_seed: false
hermes_mcp:
  mode: stdio
  # Through `hermes fetchai-bridge serve`, leave `command` unset: the Hermes
  # plugin passes Hermes' own interpreter and import path. When running
  # `hermes-fetch-ai serve` directly, set it to the Python interpreter of the
  # Hermes environment:
  # command: /path/to/hermes/venv/bin/python
  args: ["-m", "agent.transports.hermes_tools_mcp_server"]
  timeout_seconds: 20
policy:
  public_tools:
    - skills_list
  # Explicit denylist of every other tool the Hermes tools server can expose
  # (EXPOSED_TOOLS in hermes-agent 0.21.5 and main bb236287)
  # (denylist wins even if a sender allowlist is added later).
  denied_tools:
    - skill_view
    - web_search
    - web_extract
    - browser_navigate
    - browser_click
    - browser_type
    - browser_press
    - browser_snapshot
    - browser_scroll
    - browser_back
    - browser_get_images
    - browser_console
    - browser_vision
    - vision_analyze
    - image_generate
    - text_to_speech
    - kanban_complete
    - kanban_block
    - kanban_schedule
    - kanban_request_review
    - kanban_request_changes
    - kanban_comment
    - kanban_heartbeat
    - kanban_show
    - kanban_list
    - kanban_create
    - kanban_unblock
    - kanban_link
    - terminal
    - patch
    - write_file
chat:
  enable_chat: false
