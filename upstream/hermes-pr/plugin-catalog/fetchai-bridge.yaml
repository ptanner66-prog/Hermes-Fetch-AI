subdir: hermes-plugin/fetchai-bridge
description: "Puts Hermes on Fetch.ai's agent network: sell work (research, a defensive code review by a local model, or your own program) to other agents and ASI:One users for testnet FET, and let Hermes buy from other agents with your approval for every payment; it can also let uAgents call a default-deny, allowlisted subset of Hermes tools (only skills_list by default). Testnet only; mainnet is locked. Adds `hermes fetchai-bridge` (install, setup, start, stop, status, logs, and the rest of the separately installed hermes-fetch-ai bridge, which runs in its own Python environment; nothing is installed into Hermes), operate and buy skills, and four tools (fetchai_find_agents, fetchai_message_agent, fetchai_read_replies, fetchai_pay) that do nothing until the user turns on the buyer_tools setting; no hooks or middleware. Community project, not affiliated with Fetch.ai. Disclosure — `hermes fetchai-bridge` runs the hermes-fetch-ai executable (no shell) with an allowlisted environment that includes UAGENT_SEED from $HERMES_HOME/.env but not model-provider keys; `install`, run and confirmed by the user, runs `uv tool install` (or pipx) of the bridge from GitHub pinned to the git tag of the plugin's version, and nothing updates itself; `setup`, run by the user, saves the plugin's own secrets UAGENT_SEED (a new random key, only when none exists) and AGENTVERSE_API_KEY (only if pasted) with Hermes' .env writer and, if the user agrees, turns on the plugin's own buyer_tools setting; `start` runs the bridge as a long-running background process (`serve`) with a private log file, which listens on the configured port on all network interfaces and, for raw tools, starts Hermes' tools MCP server as a child process with a short environment allowlist; remote agents allowed skills_list see every installed skill's name, description and category; selling runs the user's configured programs (no shell, empty folder, timeout) or a throwaway guest Hermes with only web search and its own keys file, and reads Fetch's testnet ledger to verify each payment; with buyer_tools on, the tools search Agentverse (agentverse.ai), send the model's messages to other agents through the running bridge and read their replies, and pay testnet FET from the bridge's buying wallet only after the user approves each payment in Hermes' confirmation prompt (they refuse while YOLO mode is on, and the bridge caps each payment and each day); `setup` asks before calling Fetch's testnet faucet or listing the agent on Agentverse; `status` reads balances from the testnet ledger; in mailbox mode the bridge registers with the Almanac and Agentverse, and Almanac contract registration (off unless configured) can pay fees from the wallet derived from UAGENT_SEED; no telemetry."
