subdir: hermes-plugin/fetchai-bridge
description: "Lets Fetch.ai uAgents call a default-deny, allowlisted subset of Hermes tools (only skills_list by default) through the hermes-fetch-ai bridge, with replay protection, argument checks and a redacted audit log. Adds `hermes fetchai-bridge`, which runs the separately installed bridge in its own Python environment (nothing is installed into Hermes), operate and buy skills, and three tools (fetchai_find_agents, fetchai_message_agent, fetchai_pay) that do nothing until the user turns on the buyer_tools setting; no hooks or middleware. Community project, not affiliated with Fetch.ai. Disclosure — `hermes fetchai-bridge` runs the hermes-fetch-ai executable (no shell) with an allowlisted environment that includes UAGENT_SEED from $HERMES_HOME/.env but not model-provider keys; `serve` is a long-running process that listens on the configured port on all network interfaces and starts Hermes' tools MCP server as a child process with a short environment allowlist; remote agents allowed skills_list see every installed skill's name, description and category; with buyer_tools on, the tools search Agentverse (agentverse.ai), send the model's messages to other agents through the running bridge, and pay testnet FET from the bridge's buying wallet only after the user approves each payment in Hermes' confirmation prompt (they refuse while YOLO mode is on, and the bridge caps each payment and each day); with publish_manifest: false (the example config) the bridge makes no outbound calls of its own beyond looking up a remote caller's endpoint in the Almanac (Agentverse API or Fetch ledger) to reply; with publish_manifest: true or mailbox mode it also registers with the Almanac and Agentverse, and Almanac registration can pay fees from the wallet derived from UAGENT_SEED; no telemetry."
maintainer: ptanner66-prog
tier: community
category: tools
