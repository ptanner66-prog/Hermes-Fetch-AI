description: "Lets Fetch.ai uAgents call a default-deny, allowlisted subset of Hermes tools (only skills_list by default) through the hermes-fetch-ai bridge, with replay protection, argument checks and a redacted audit log. Adds `hermes fetchai-bridge`, which runs the separately installed bridge in its own Python environment (nothing is installed into Hermes), and an operate skill. Community project, not affiliated with Fetch.ai. Disclosure — `hermes fetchai-bridge` runs the hermes-fetch-ai executable (no shell) with the user's environment, including UAGENT_SEED from $HERMES_HOME/.env; `serve` is a long-running process that listens on the configured port, starts Hermes' tools MCP server as a child process with an allowlisted environment, and with publish_manifest: false (the example config) makes no outbound calls of its own beyond looking up a remote caller's endpoint in the Almanac (Agentverse API or Fetch ledger) to reply; with publish_manifest: true or mailbox mode it also registers with the Almanac and Agentverse; no telemetry."
