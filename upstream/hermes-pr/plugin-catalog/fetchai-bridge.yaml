name: fetchai-bridge
repo: https://github.com/ptanner66-prog/Hermes-Fetch-AI
sha: REPLACE_WITH_THE_40_CHARACTER_COMMIT_SHA
subdir: hermes-plugin/fetchai-bridge
description: "Lets your Hermes sell work to other AI agents and buy work from them on Fetch.ai's agent network, with free test money (testnet FET), and asks you before every payment its tools make. Sells research, a defensive code review by a local model, or your own program to other agents and ASI:One users; testnet only, mainnet is locked; setup is plain questions (`hermes fetchai-bridge install`, `setup`, `start`). It can also let uAgents call a default-deny, allowlisted subset of Hermes tools (none unless configured). Adds `hermes fetchai-bridge` (install, setup, start, stop, status, logs, and the rest of the separately installed hermes-fetch-ai bridge, which runs in its own Python environment; nothing is installed into Hermes), operate and buy skills, and four tools (fetchai_find_agents, fetchai_message_agent, fetchai_read_replies, fetchai_pay) that do nothing until the user turns on the buyer_tools setting; no hooks or middleware. Community project, not affiliated with Fetch.ai. Disclosure — `hermes fetchai-bridge` runs the hermes-fetch-ai executable (no shell) with an allowlisted environment that includes UAGENT_SEED from $HERMES_HOME/.env but not model-provider keys; `install`, run and confirmed by the user, runs `uv tool install` (or pipx) of the bridge from GitHub pinned to the git tag of the plugin's version, and nothing updates itself; `setup`, run by the user, saves the plugin's own secrets UAGENT_SEED (a new random key, only when none exists) and AGENTVERSE_API_KEY (only if pasted) with Hermes' .env writer and, if the user agrees, turns on the plugin's own buyer_tools setting; `start` runs the bridge as a long-running background process (`serve`) with a private log file, which listens on the configured port on all network interfaces and, when configured to share Hermes tools, starts Hermes' tools MCP server as a child process with a short environment allowlist; remote agents allowed skills_list see every installed skill's name, description and category; selling runs the user's configured programs (no shell, empty folder, timeout) or a throwaway guest Hermes with only Hermes' web tools (search and reading pages) and its own keys file (research uses the user's own model-provider key, which costs real money; setup caps it at 20 requests a day unless the user chooses otherwise), and reads Fetch's testnet ledger to verify each payment; with buyer_tools on, the tools search Agentverse (agentverse.ai), send the model's messages to other agents through the running bridge and read their replies, and pay testnet FET from the bridge's buying wallet only after the user approves each payment in Hermes' confirmation prompt (they refuse while YOLO mode is on or in Hermes' plugin host, and the bridge caps each payment, each seller, and each day; the bridge's buyer commands, which Hermes' terminal tool can also run, pay without that prompt but within the same caps); `setup` asks before calling Fetch's testnet faucet or listing the agent on Agentverse; `status` reads balances from the testnet ledger; with publish_manifest or in mailbox mode the bridge registers with the Almanac (through Agentverse's API) and Agentverse, and Almanac contract registration (off unless configured) can pay fees from the wallet derived from UAGENT_SEED; no telemetry."
maintainer: ptanner66-prog
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/ptanner66-prog/Hermes-Fetch-AI/blob/main/docs/hermes-plugin.md
version: "1.0.0"
platforms: []
known_issues:
  - "On Hermes 0.21.5 the payment prompt works in the TUI and messaging apps; in the classic CLI it may decline without being shown. Nothing is paid without an accept."
  - "The buying tools refuse under plugins.isolation: host, where they cannot see a session's /yolo or show the payment prompt; they need plugins.isolation: in_process."
  - "Hermes' terminal can run the bridge's buyer pay without the prompt, within the bridge's limits; approvals.deny: ['*buyer pay*'] blocks it, even in YOLO mode."
capabilities:
  provides_tools: [fetchai_find_agents, fetchai_message_agent, fetchai_read_replies, fetchai_pay]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
